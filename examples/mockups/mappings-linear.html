<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ModelScope Proxy — 模型映射 (Linear Style)</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { font-family: 'Inter', system-ui, sans-serif; }
</style>
</head>
<body class="bg-[#0e0e10] text-white">

<div class="flex min-h-screen">
  <!-- Sidebar -->
  <aside class="w-56 bg-[#0e0e10] border-r border-gray-800 flex flex-col flex-shrink-0">
    <div class="px-5 py-5">
      <div class="flex items-center gap-2.5">
        <div class="w-7 h-7 rounded-lg bg-gradient-to-br from-[#5e6ad2] to-[#6b7bf2] flex items-center justify-center">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </div>
        <span class="font-semibold tracking-tight text-white text-sm">ModelScope Proxy</span>
      </div>
    </div>
    <nav class="px-2 mt-2 space-y-0.5">
      <a href="#" class="flex items-center gap-2.5 px-2.5 py-1.5 text-sm text-gray-400 hover:text-white hover:bg-[#1a1a1e] rounded-md"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>仪表盘</a>
      <a href="#" class="flex items-center gap-2.5 px-2.5 py-1.5 text-sm text-gray-400 hover:text-white hover:bg-[#1a1a1e] rounded-md"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>账户管理</a>
      <a href="#" class="flex items-center gap-2.5 px-2.5 py-1.5 text-sm bg-[#1a1a1e] rounded-md text-white"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54 .54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>模型映射</a>
      <a href="#" class="flex items-center gap-2.5 px-2.5 py-1.5 text-sm text-gray-400 hover:text-white hover:bg-[#1a1a1e] rounded-md"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/></svg>请求日志</a>
      <a href="#" class="flex items-center gap-2.5 px-2.5 py-1.5 text-sm text-gray-400 hover:text-white hover:bg-[#1a1a1e] rounded-md"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>使用统计</a>
      <a href="#" class="flex items-center gap-2.5 px-2.5 py-1.5 text-sm text-gray-400 hover:text-white hover:bg-[#1a1a1e] rounded-md"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/></svg>告警历史</a>
      <a href="#" class="flex items-center gap-2.5 px-2.5 py-1.5 text-sm text-gray-400 hover:text-white hover:bg-[#1a1a1e] rounded-md"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>在线测试</a>
      <a href="#" class="flex items-center gap-2.5 px-2.5 py-1.5 text-sm text-gray-400 hover:text-white hover:bg-[#1a1a1e] rounded-md"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06"/></svg>系统配置</a>
    </nav>
  </aside>

  <!-- Main -->
  <main class="flex-1 bg-[#0e0e10]">
    <header class="bg-[#0e0e10]/80 backdrop-blur-md border-b border-gray-800 px-6 py-3 flex items-center justify-between">
      <div>
        <h1 class="text-lg font-semibold tracking-tight text-white">模型映射</h1>
        <p class="text-xs text-gray-500 mt-0.5">管理模型别名与实际模型 ID 的映射关系</p>
      </div>
      <button class="bg-[#5e6ad2] text-white font-medium rounded-lg h-9 px-4 text-sm hover:bg-[#6b7bf2] transition-all inline-flex items-center gap-2">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        添加映射
      </button>
    </header>

    <div class="p-6">

      <!-- Mapping cards -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">

        <div class="bg-[#1a1a1e] rounded-lg border border-gray-800 p-5">
          <div class="flex items-center justify-between mb-4">
            <div>
              <p class="text-xs text-gray-500 mb-0.5">别名</p>
              <p class="text-sm font-mono text-[#5e6ad2] font-semibold">hy3</p>
            </div>
            <div class="flex items-center gap-2">
              <span class="inline-flex items-center rounded-md px-1.5 py-0.5 bg-green-500/10 text-green-400 text-xs">活跃</span>
              <button class="text-gray-400 hover:text-white p-1"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
              <button class="text-gray-400 hover:text-white p-1"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <p class="text-xs text-gray-500 mb-1.5">中国大陆</p>
              <p class="text-sm font-mono text-white bg-[#0e0e10] rounded-md px-3 py-2">hy3</p>
            </div>
            <div>
              <p class="text-xs text-gray-500 mb-1.5">海外</p>
              <p class="text-sm font-mono text-white bg-[#0e0e10] rounded-md px-3 py-2">hy3 overseas</p>
            </div>
          </div>
        </div>

        <div class="bg-[#1a1a1e] rounded-lg border border-gray-800 p-5">
          <div class="flex items-center justify-between mb-4">
            <div>
              <p class="text-xs text-gray-500 mb-0.5">别名</p>
              <p class="text-sm font-mono text-[#5e6ad2] font-semibold">qwen2.5-7b</p>
            </div>
            <div class="flex items-center gap-2">
              <span class="inline-flex items-center rounded-md px-1.5 py-0.5 bg-green-500/10 text-green-400 text-xs">活跃</span>
              <button class="text-gray-400 hover:text-white p-1"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
              <button class="text-gray-400 hover:text-white p-1"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <p class="text-xs text-gray-500 mb-1.5">中国大陆</p>
              <p class="text-sm font-mono text-white bg-[#0e0e10] rounded-md px-3 py-2">qwen2.5-7b</p>
            </div>
            <div>
              <p class="text-xs text-gray-500 mb-1.5">海外</p>
              <p class="text-sm font-mono text-white bg-[#0e0e10] rounded-md px-3 py-2">qwen2.5-7b-instruct</p>
            </div>
          </div>
        </div>

        <!-- Add new placeholder -->
        <div class="bg-[#0e0e10] rounded-lg border-2 border-dashed border-gray-700 p-5 flex flex-col items-center justify-center gap-2 min-h-[180px] hover:border-gray-600 transition-colors">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="text-gray-500"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="12" y2="12"/></svg>
          <p class="text-sm text-gray-500">添加新的模型映射</p>
        </div>
      </div>

      <!-- Bulk edit -->
      <div class="bg-[#1a1a1e] rounded-lg border border-gray-800">
        <div class="px-5 py-3.5 border-b border-gray-800">
          <h2 class="font-semibold tracking-tight text-sm">批量编辑 (JSON)</h2>
        </div>
        <div class="p-5">
          <textarea class="w-full bg-[#0e0e10] rounded-lg border border-gray-800 px-3 py-3 text-sm text-white font-mono focus:outline-none focus:border-[#5e6ad2] resize-none" rows="10">
{
  "hy3": {
    "china": "hy3",
    "overseas": "hy3 overseas"
  },
  "qwen2.5-7b": {
    "china": "qwen2.5-7b",
    "overseas": "qwen2.5-7b-instruct"
  }
}</textarea>
          <div class="flex items-center justify-between mt-3">
            <p class="text-xs text-gray-500">JSON 格式：key 为别名，value 为各区域对应的实际模型 ID</p>
            <button class="bg-[#5e6ad2] text-white font-medium rounded-lg h-9 px-6 text-sm hover:bg-[#6b7bf2] transition-all">保存</button>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

</body>
</html>
