<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ModelScope Proxy — 系统配置 (Linear Style)</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { font-family: 'Inter', system-ui, sans-serif; }
</style>
</head>
<body class="bg-[#0e0e10] text-white">

<div class="flex min-h-screen">
  <!-- Sidebar -->
  <aside class="w-56 bg-[#0e0e10] border-r border-gray-800 flex flex-col flex-shrink-0">
    <div class="px-5 py-5">
      <div class="flex items-center gap-2.5">
        <div class="w-7 h-7 rounded-lg bg-gradient-to-br from-[#5e6ad2] to-[#6b7bf2] flex items-center justify-center">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </div>
        <span class="font-semibold tracking-tight text-white text-sm">ModelScope Proxy</span>
      </div>
    </div>
    <nav class="px-2 mt-2 space-y-0.5">
      <a href="#" class="flex items-center gap-2.5 px-2.5 py-1.5 text-sm text-gray-400 hover:text-white hover:bg-[#1a1a1e] rounded-md"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>仪表盘</a>
      <a href="#" class="flex items-center gap-2.5 px-2.5 py-1.5 text-sm text-gray-400 hover:text-white hover:bg-[#1a1a1e] rounded-md"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>账户管理</a>
      <a href="#" class="flex items-center gap-2.5 px-2.5 py-1.5 text-sm text-gray-400 hover:text-white hover:bg-[#1a1a1e] rounded-md"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54 .54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/></svg>模型映射</a>
      <a href="#" class="flex items-center gap-2.5 px-2.5 py-1.5 text-sm text-gray-400 hover:text-white hover:bg-[#1a1a1e] rounded-md"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/></svg>请求日志</a>
      <a href="#" class="flex items-center gap-2.5 px-2.5 py-1.5 text-sm text-gray-400 hover:text-white hover:bg-[#1a1a1e] rounded-md"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>使用统计</a>
      <a href="#" class="flex items-center gap-2.5 px-2.5 py-1.5 text-sm text-gray-400 hover:text-white hover:bg-[#1a1a1e] rounded-md"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/></svg>告警历史</a>
      <a href="#" class="flex items-center gap-2.5 px-2.5 py-1.5 text-sm text-gray-400 hover:text-white hover:bg-[#1a1a1e] rounded-md"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>在线测试</a>
      <a href="#" class="flex items-center gap-2.5 px-2.5 py-1.5 text-sm bg-[#1a1a1e] rounded-md text-white"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06"/></svg>系统配置</a>
    </nav>
  </aside>

  <!-- Main -->
  <main class="flex-1 bg-[#0e0e10]">
    <header class="bg-[#0e0e10]/80 backdrop-blur-md border-b border-gray-800 px-6 py-3 flex items-center justify-between">
      <div>
        <h1 class="text-lg font-semibold tracking-tight text-white">系统配置</h1>
        <p class="text-xs text-gray-500 mt-0.5">全局参数和服务设置</p>
      </div>
    </header>

    <div class="p-6 grid grid-cols-1 lg:grid-cols-2 gap-6">

      <!-- Server Settings -->
      <div class="bg-[#1a1a1e] rounded-lg border border-gray-800">
        <div class="px-5 py-3.5 border-b border-gray-800">
          <h2 class="font-semibold tracking-tight text-sm">服务设置</h2>
        </div>
        <div class="p-5 space-y-4">
          <div>
            <label class="block text-xs text-gray-500 mb-1.5">监听地址</label>
            <input type="text" value="0.0.0.0" class="w-full bg-[#0e0e10] rounded-lg border border-gray-800 px-3 py-2 text-sm text-white font-mono focus:outline-none focus:border-[#5e6ad2]">
          </div>
          <div>
            <label class="block text-xs text-gray-500 mb-1.5">监听端口</label>
            <input type="number" value="8000" class="w-full bg-[#0e0e10] rounded-lg border border-gray-800 px-3 py-2 text-sm text-white font-mono focus:outline-none focus:border-[#5e6ad2]">
          </div>
          <div>
            <label class="block text-xs text-gray-500 mb-1.5">API 前缀</label>
            <input type="text" value="/api" class="w-full bg-[#0e0e10] rounded-lg border border-gray-800 px-3 py-2 text-sm text-white font-mono focus:outline-none focus:border-[#5e6ad2]">
          </div>
        </div>
      </div>

      <!-- Database Settings -->
      <div class="bg-[#1a1a1e] rounded-lg border border-gray-800">
        <div class="px-5 py-3.5 border-b border-gray-800">
          <h2 class="font-semibold tracking-tight text-sm">数据库设置</h2>
        </div>
        <div class="p-5 space-y-4">
          <div>
            <label class="block text-xs text-gray-500 mb-1.5">数据库路径</label>
            <input type="text" value="/mnt/d/workspace/third/provider/modelscope_proxy.db" class="w-full bg-[#0e0e10] rounded-lg border border-gray-800 px-3 py-2 text-sm text-white font-mono focus:outline-none focus:border-[#5e6ad2]">
          </div>
          <div>
            <label class="block text-xs text-gray-500 mb-1.5">数据库大小</label>
            <p class="text-sm text-gray-400 font-mono">2.4 MB</p>
          </div>
        </div>
      </div>

      <!-- Log Settings -->
      <div class="bg-[#1a1a1e] rounded-lg border border-gray-800">
        <div class="px-5 py-3.5 border-b border-gray-800">
          <h2 class="font-semibold tracking-tight text-sm">日志设置</h2>
        </div>
        <div class="p-5 space-y-4">
          <div>
            <label class="block text-xs text-gray-500 mb-1.5">日志级别</label>
            <select class="w-full bg-[#0e0e10] rounded-lg border border-gray-800 px-3 py-2 text-sm text-white focus:outline-none focus:border-[#5e6ad2]">
              <option>DEBUG</option>
              <option selected>INFO</option>
              <option>WARNING</option>
              <option>ERROR</option>
            </select>
          </div>
          <div class="flex items-center justify-between">
            <div>
              <p class="text-sm text-white">请求日志持久化</p>
              <p class="text-xs text-gray-500 mt-0.5">将请求日志写入数据库</p>
            </div>
            <label class="relative inline-flex items-center cursor-pointer">
              <input type="checkbox" checked class="sr-only peer">
              <div class="w-9 h-5 bg-gray-700 rounded-full peer peer-checked:bg-[#5e6ad2] transition-all after:content-[''] after:absolute after:top-0.5 after:left-0.5 after:bg-white after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:after:translate-x-4"></div>
            </label>
          </div>
        </div>
      </div>

      <!-- Load Balancer -->
      <div class="bg-[#1a1a1e] rounded-lg border border-gray-800">
        <div class="px-5 py-3.5 border-b border-gray-800">
          <h2 class="font-semibold tracking-tight text-sm">负载均衡策略</h2>
        </div>
        <div class="p-5 space-y-4">
          <div>
            <label class="block text-xs text-gray-500 mb-1.5">策略</label>
            <select class="w-full bg-[#0e0e10] rounded-lg border border-gray-800 px-3 py-2 text-sm text-white focus:outline-none focus:border-[#5e6ad2]">
              <option selected>轮询 (Round-Robin)</option>
              <option>最少连接</option>
              <option>随机</option>
            </select>
          </div>
          <div>
            <label class="block text-xs text-gray-500 mb-1.5">超时 (ms)</label>
            <input type="number" value="30000" class="w-full bg-[#0e0e10] rounded-lg border border-gray-800 px-3 py-2 text-sm text-white font-mono focus:outline-none focus:border-[#5e6ad2]">
          </div>
          <div>
            <label class="block text-xs text-gray-500 mb-1.5">重试次数</label>
            <input type="number" value="0" class="w-full bg-[#0e0e10] rounded-lg border border-gray-800 px-3 py-2 text-sm text-white font-mono focus:outline-none focus:border-[#5e6ad2]">
          </div>
        </div>
      </div>

      <!-- Quota Settings -->
      <div class="bg-[#1a1a1e] rounded-lg border border-gray-800">
        <div class="px-5 py-3.5 border-b border-gray-800">
          <h2 class="font-semibold tracking-tight text-sm">配额设置</h2>
        </div>
        <div class="p-5 space-y-4">
          <div class="flex items-center justify-between">
            <div>
              <p class="text-sm text-white">配额耗尽自动禁用</p>
              <p class="text-xs text-gray-500 mt-0.5">账户配额耗尽时自动标记为不可用</p>
            </div>
            <label class="relative inline-flex items-center cursor-pointer">
              <input type="checkbox" checked class="sr-only peer">
              <div class="w-9 h-5 bg-gray-700 rounded-full peer peer-checked:bg-[#5e6ad2] transition-all after:content-[''] after:absolute after:top-0.5 after:left-0.5 after:bg-white after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:after:translate-x-4"></div>
            </label>
          </div>
          <div class="flex items-center justify-between">
            <div>
              <p class="text-sm text-white">每日自动重置配额</p>
              <p class="text-xs text-gray-500 mt-0.5">每日 00:00 自动刷新配额状态</p>
            </div>
            <label class="relative inline-flex items-center cursor-pointer">
              <input type="checkbox" checked class="sr-only peer">
              <div class="w-9 h-5 bg-gray-700 rounded-full peer peer-checked:bg-[#5e6ad2] transition-all after:content-[''] after:absolute after:top-0.5 after:left-0.5 after:bg-white after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:after:translate-x-4"></div>
            </label>
          </div>
        </div>
      </div>

      <!-- About -->
      <div class="bg-[#1a1a1e] rounded-lg border border-gray-800">
        <div class="px-5 py-3.5 border-b border-gray-800">
          <h2 class="font-semibold tracking-tight text-sm">关于</h2>
        </div>
        <div class="p-5 space-y-2">
          <div class="flex justify-between text-sm">
            <span class="text-gray-500">版本</span>
            <span class="text-white font-mono">v0.1.0</span>
          </div>
          <div class="flex justify-between text-sm">
            <span class="text-gray-500">运行时长</span>
            <span class="text-white font-mono">3d 14h 22m</span>
          </div>
          <div class="flex justify-between text-sm">
            <span class="text-gray-500">Python</span>
            <span class="text-white font-mono">3.12.4</span>
          </div>
          <div class="flex justify-between text-sm">
            <span class="text-gray-500">Uvicorn</span>
            <span class="text-white font-mono">0.30.1</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Save bar -->
    <div class="px-6 pb-6">
      <div class="bg-[#1a1a1e] rounded-lg border border-gray-800 px-5 py-3 flex items-center justify-between">
        <p class="text-xs text-gray-500">修改后请点击保存以应用配置</p>
        <div class="flex items-center gap-2.5">
          <button class="text-sm text-gray-400 hover:text-white px-4 py-1.5 rounded-md">取消</button>
          <button class="bg-[#5e6ad2] text-white font-medium rounded-lg h-9 px-6 text-sm hover:bg-[#6b7bf2] transition-all">保存配置</button>
        </div>
      </div>
    </div>
  </main>
</div>

</body>
</html>
